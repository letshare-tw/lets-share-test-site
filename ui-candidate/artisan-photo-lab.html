<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>樂享家｜商品照片實驗室</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f0e8;color:#253c32;font:16px system-ui}main{max-width:640px;margin:auto;padding:20px}section{background:white;padding:18px;border-radius:22px;margin:16px 0;box-shadow:0 5px 20px #253c3208}h1{font-size:25px}p{line-height:1.6;color:#68746c}button,a.btn{border:0;border-radius:12px;padding:13px 16px;background:#09923a;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.4}button.light{background:#edf0ea;color:#253c32}.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.row>*{flex:1}video,canvas{width:100%;display:block;border-radius:14px}video{max-height:45vh;background:#15251c}canvas{background:repeating-conic-gradient(#eee 0% 25%,#fff 0% 50%) 0/20px 20px;touch-action:manipulation}small{line-height:1.6;display:block;color:#69766c}input[type=range]{width:100%}label{display:block;margin:12px 0}a{color:#087d32}[hidden]{display:none!important}.tag{font-size:12px;color:#7a776d}#status{min-height:25px}figure{margin:15px 0}figcaption{font-size:14px;margin:6px 0}</style><main><span class="tag">PHOTO LAB 01 · 獨立測試</span><h1>商品照片試拍</h1><p>衣物平放在單色背景，四邊留白。旁邊放一小張攝影用中性灰卡，與衣服受到相同光線。</p><section><video id="video" autoplay playsinline muted></video><div class="row"><button id="start">開啟後置相機</button><button id="shoot" disabled>拍照</button><button id="stop" class="light">關閉</button></div><div id="status" role="status" aria-live="polite">照片只在手機處理，不上傳。重新整理即清除。</div></section><section id="editor" hidden><div class="row"><button id="neutral">① 點灰卡校色</button><button id="background">② 點背景去背</button></div><small id="hint">先選上方操作，再點下方「處理預覽」的對應位置。</small><label>去背容許範圍 <output id="amount">30</output><input id="tolerance" type="range" min="5" max="90" value="30"></label><label><input id="white" type="checkbox"> 白底預覽／下載（取消為透明 PNG）</label><figure><figcaption>處理預覽 · 點擊取樣</figcaption><canvas id="result" aria-label="處理預覽，點選灰卡或背景取樣"></canvas></figure><details><summary>查看原始拍攝照片</summary><figure><canvas id="original"></canvas></figure></details><div class="row"><button id="reset" class="light">還原原圖</button><button id="save">下載處理照片</button></div><button id="saveOriginal" class="light">下載原始拍攝照片</button><p><small>校色為灰卡白平衡試驗，尚非完整色卡校正。去背從點選位置移除相近連續色塊；背景與衣服同色可能誤刪，陰影、蕾絲與複雜背景可能殘留。請比較原圖再採用；不會自動寫入商品資料。</small></p></section><a href="artisan.html">返回職人工作站</a></main><script src="artisan-photo-lab.js?v=PHOTO-LAB-01"></script></html>
