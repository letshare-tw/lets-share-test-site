<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="same-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src https://rfwqcrvxyjhtmafnbuyy.supabase.co; frame-ancestors 'none'; object-src 'none'; base-uri 'none'">
<title>樂享家｜受控手機驗證</title>
<style>body{margin:0;background:#f4f8f5;color:#1c3027;font:18px/1.65 system-ui,sans-serif}main{max-width:560px;margin:24px auto;padding:24px;background:white;border-radius:20px}h1{font-size:28px;margin-top:0}label{display:block;margin:18px 0 6px}input[type=tel],input[type=text]{box-sizing:border-box;width:100%;padding:14px;font:inherit;border:1px solid #899e92;border-radius:10px}button,a{font:inherit}button{padding:14px 18px;border:0;border-radius:10px;background:#108548;color:white;min-height:52px;margin:12px 0;width:100%}button:disabled{background:#d9e2dc;color:#4c5e53}a{color:#087a40}#status{white-space:pre-line;overflow-wrap:anywhere;padding:16px;background:#eef6ef;border-radius:12px}.notice{background:#fff3c9;padding:14px;border-radius:12px}small{display:block;color:#53645a}input[type=checkbox]{width:22px;height:22px;vertical-align:middle}@media(max-width:600px){main{margin:12px;padding:20px}}</style></head>
<body><main><h1>受控手機驗證</h1><p>僅限本次原 Google 測試會員。首次新增手機，保留同一會員。</p>
<p class="notice">目前只開放檢查，尚未開放發送簡訊。</p>
<p id="status" role="status" aria-live="polite">正在確認原會員登入…</p>
<a href="./index.html">返回測試站登入／會員中心</a>
<label for="phone">本次測試手機（末三碼 916）</label><input id="phone" type="tel" inputmode="tel" autocomplete="off" placeholder="09 開頭十碼">
<button id="check" type="button">確認會員與手機（不發簡訊）</button>
<label><input id="consent" type="checkbox" disabled> 我確認僅發送一次，不自動重送</label>
<button id="send" type="button" disabled>發送一次簡訊（尚未授權開放）</button>
<label for="otp">手機收到的六位數驗證碼</label><input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" disabled>
<button id="verify" type="button" disabled>驗證並綁定原會員</button>
<small>請直接在此輸入驗證碼，不要傳到聊天中。此頁的次數限制僅適用同一瀏覽器；清除網站資料或換瀏覽器不屬於伺服器端防重送保證。</small>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js" integrity="sha384-uteMfOloLDGt042uDz+xHGF3ym63/WQ6rFq7murQRG8Ih7QrXGEGNtWd8688sb4O" crossorigin="anonymous"></script>
<script src="./controlled-phone-adapter.js?v=C07C-02"></script><script src="./controlled-phone-ui.js?v=C07C-02"></script></body></html>
